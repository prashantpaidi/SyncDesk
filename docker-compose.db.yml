version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: syncdesk-db-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-syncdesk}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-syncdesk}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data-dev:
