spring.application.name=SyncDesk
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000


# ? DATABASE CONFIGURATION (ADD THIS)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/syncdesk}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Server
server.port=8080

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}


# ? REDIS CACHE CONFIGURATION (cache-aside for dashboard aggregates)
# Connection details come from the environment; the defaults target a local
# Redis (see docker-compose.db.yml). No credentials are hardcoded.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# Share one Lettuce connection for cache commands so cache writes/evictions are
# applied eagerly and are immediately visible to the next reader.
spring.data.redis.lettuce.share-native-connection=${REDIS_SHARE_NATIVE_CONNECTION:true}

# Cache toggle + TTL.
#   syncdesk.cache.enabled=false disables caching entirely (used by the k6
#   baseline run) without any code change.
#   syncdesk.cache.dashboard-ttl bounds how long a dashboard snapshot may live.
#   Mutations evict the cache eagerly, so the TTL is only a backstop.
syncdesk.cache.enabled=${CACHE_ENABLED:true}
syncdesk.cache.dashboard-ttl=${DASHBOARD_CACHE_TTL:60s}


# 1. Maximum number of connections in the pool
# For a 1GB RAM VM, 2-4 is plenty.
spring.datasource.hikari.maximum-pool-size=3

# 2. How long a connection can sit idle before being closed
spring.datasource.hikari.idle-timeout=30000

# 3. Minimum number of connections to keep open
spring.datasource.hikari.minimum-idle=1

# 4. Maximum time to wait for a connection from the pool
spring.datasource.hikari.connection-timeout=20000

# 5. Max lifetime of a connection (Neon recommends keeping this under 30 mins)
spring.datasource.hikari.max-lifetime=1800000
